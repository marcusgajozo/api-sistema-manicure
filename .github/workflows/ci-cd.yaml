name: Deploy Pipeline

on:
  push:
    branches:
      - prd

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Run database migrations
        run: pnpm migration:run
        env:
          DATABASE_HOST_EXTERNAL: ${{ secrets.PROD_DB_HOST }}
          DATABASE_PORT_EXTERNAL: ${{ secrets.PROD_DB_PORT }}
          DATABASE_USER: ${{ secrets.PROD_DB_USER }}
          DATABASE_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          DATABASE_NAME: ${{ secrets.PROD_DB_NAME }}

  deploy:
    needs: [build, migrate]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer Webhook
        run: |
          curl -k -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
