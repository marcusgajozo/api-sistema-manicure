volumes:
  pg-data:
  rabbitmq_data:
  evolution_instances:
  evolution_postgres_data:
  evolution_redis_data:

networks:
  api-sistema-manicure-network:
    driver: bridge

services:
  api-sistema-manicure:
    build:
      context: .
      target: local
    user: '${DOCKER_UID:-1000}:${DOCKER_GID:-1000}'
    # image: ghcr.io/marcusgajozo/api-sistema-manicure:latest
    container_name: api-sistema-manicure
    ports:
      - '${API_PORT_EXTERNAL:-3000}:3000'
    env_file:
      - '.env'
    volumes:
      - .:/usr/src/app
    command: sh -c "pnpm start:dev"
    networks:
      - api-sistema-manicure-network
    depends_on:
      postgres-sistema-manicure-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://localhost:3000/swagger-json >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  postgres-sistema-manicure-db:
    image: postgres:18-alpine
    container_name: postgres-sistema-manicure-db
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql
    ports:
      - '${DATABASE_PORT_EXTERNAL}:5432'
    networks:
      - api-sistema-manicure-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - '${EVOLUTION_PORT_EXTERNAL:-8080}:8080'
    volumes:
      - evolution_instances:/evolution/instances
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: 'postgresql://${EVOLUTION_DATABASE_USER}:${EVOLUTION_DATABASE_PASSWORD}@evolution-postgres:5432/${EVOLUTION_DATABASE_NAME}?schema=evolution_api'
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CONFIG_SESSION_PHONE_CLIENT: 'Sistema Manicure'
      CONFIG_SESSION_PHONE_NAME: Chrome
    networks:
      - api-sistema-manicure-network
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy

  evolution-manager:
    image: evoapicloud/evolution-manager:latest
    container_name: evolution-manager
    restart: unless-stopped
    ports:
      - '${EVOLUTION_MANAGER_PORT_EXTERNAL:-8081}:80'
    networks:
      - api-sistema-manicure-network

  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVOLUTION_DATABASE_NAME}
      POSTGRES_USER: ${EVOLUTION_DATABASE_USER}
      POSTGRES_PASSWORD: ${EVOLUTION_DATABASE_PASSWORD}
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    networks:
      - api-sistema-manicure-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  evolution-redis:
    image: redis:8-alpine
    container_name: evolution-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis_data:/data
    networks:
      - api-sistema-manicure-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
