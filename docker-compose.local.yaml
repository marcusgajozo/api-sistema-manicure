volumes:
  pg-data:

networks:
  api-sistema-manicure-network:
    driver: bridge

services:
  api-sistema-manicure:
    build:
      context: .
      target: local
    user: '${DOCKER_UID:-1000}:${DOCKER_GID:-1000}'
    # image: ghcr.io/marcusgajozo/api-sistema-manicure:latest
    container_name: api-sistema-manicure
    ports:
      - '${API_PORT_EXTERNAL:-3000}:3000'
    env_file:
      - '.env'
    volumes:
      - .:/usr/src/app
    command: sh -c "pnpm start:dev"
    networks:
      - api-sistema-manicure-network
    depends_on:
      postgres-sistema-manicure-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://localhost:3000/swagger-json >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  postgres-sistema-manicure-db:
    image: postgres:18-alpine
    container_name: postgres-sistema-manicure-db
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql
    ports:
      - '127.0.0.1:${DATABASE_PORT_EXTERNAL}:5432'
    networks:
      - api-sistema-manicure-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
