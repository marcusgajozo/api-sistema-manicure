volumes:
  pg-data:

networks:
  api-manicure-network:

services:
  api-manicure:
    build:
      context: .
      target: development
    user: '${DOCKER_UID:-1000}:${DOCKER_GID:-1000}'
    volumes:
      - .:/usr/src/app
    ports:
      - '${API_PORT:-3000}:3000'
    networks:
      - api-manicure-network
    depends_on:
      - postgres-manicure-db

  postgres-manicure-db:
    image: postgres:18-alpine
    container_name: postgres-manicure-db
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USER}
    ports:
      - '${DATABASE_PORT_EXTERNAL}:5432'
    networks:
      - api-manicure-network
    volumes:
      - pg-data:/var/lib/postgresql/data
